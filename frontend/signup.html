<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up · Atmos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=JetBrains+Mono:wght@300;400;500&family=Inter+Tight:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="page-auth">
    <div class="grain"></div>
    <main class="auth-shell">
      <a href="/" class="brand brand--small">
        <span class="brand__mark">◐</span>
        <span class="brand__name">Atmos</span>
      </a>

      <div class="auth-card">
        <p class="eyebrow">New observer</p>
        <h1 class="display display--sm">
          Pull up a chair<br />by the <em>window</em>.
        </h1>

        <form id="signupForm" class="form" autocomplete="on">
          <label class="field">
            <span class="field__label">Display name <span class="dim">(optional)</span></span>
            <input
              type="text"
              name="displayName"
              autocomplete="name"
              class="field__input"
            />
          </label>
          <label class="field">
            <span class="field__label">Email</span>
            <input
              type="email"
              name="email"
              required
              autocomplete="email"
              class="field__input"
            />
          </label>
          <label class="field">
            <span class="field__label">Password <span class="dim">(8+ characters)</span></span>
            <input
              type="password"
              name="password"
              required
              minlength="8"
              autocomplete="new-password"
              class="field__input"
            />
          </label>

          <div class="form__error hidden" id="formError"></div>

          <button type="submit" class="btn btn--primary btn--block">
            Begin observing
          </button>
        </form>

        <p class="auth-card__alt">
          Already have an account? <a class="link" href="/login.html">Log in</a>
        </p>
      </div>
    </main>

    <script src="/js/auth.js"></script>
    <script>
      (function () {
        if (Auth.token()) location.href = '/';
        const form = document.getElementById('signupForm');
        const errEl = document.getElementById('formError');

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          errEl.classList.add('hidden');
          const fd = new FormData(form);
          try {
            await Auth.signup(
              fd.get('email'),
              fd.get('password'),
              fd.get('displayName') || null
            );
            if (typeof pendo !== 'undefined') {
              pendo.track('user_signed_up', {
                hasDisplayName: !!fd.get('displayName')
              });
            }
            location.href = '/';
          } catch (err) {
            errEl.textContent = err.message;
            errEl.classList.remove('hidden');
          }
        });
      })();
    </script>
  </body>
</html>
